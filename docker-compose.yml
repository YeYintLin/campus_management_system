services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Internal-only DB: no host port published. Other services can still reach it at `mongo:27017`.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      PORT: 5001
      CORE_SERVICE_URL: http://core-service:5002
      ATTENDANCE_SERVICE_URL: http://attendance-service:5003
      AI_SERVICE_URL: http://ai-service:5004
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      core-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  core-service:
    build:
      context: ./services/core
    restart: unless-stopped
    environment:
      PORT: 5002
      MONGODB_URI: ${MONGODB_URI_CORE:-mongodb://mongo:27017/core_db}
      JWT_SECRET: ${JWT_SECRET:-2580d3dfd4e5ff37ca503b4b9eba71a1cbf716ffffb2d4b72ee65834b230223a401c0cd43914f1041c3106e6053da8b4d36275a79e9cba0c54f440b75534f792}
      ATTENDANCE_SERVICE_URL: http://attendance-service:5003
    ports:
      - "5002:5002"
    volumes:
      - ./services/core/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  attendance-service:
    build:
      context: ./services/attendance
    restart: unless-stopped
    environment:
      PORT: 5003
      MONGODB_URI: ${MONGODB_URI_ATTENDANCE:-mongodb://mongo:27017/attendance_db}
      JWT_SECRET: ${JWT_SECRET:-2580d3dfd4e5ff37ca503b4b9eba71a1cbf716ffffb2d4b72ee65834b230223a401c0cd43914f1041c3106e6053da8b4d36275a79e9cba0c54f440b75534f792}
      CORE_SERVICE_URL: http://core-service:5002
    ports:
      - "5003:5003"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ai-service:
    build:
      context: ./services/ai
    restart: unless-stopped
    environment:
      PORT: 5004
      MONGODB_URI: ${MONGODB_URI_AI:-mongodb://mongo:27017/ai_db}
      JWT_SECRET: ${JWT_SECRET:-2580d3dfd4e5ff37ca503b4b9eba71a1cbf716ffffb2d4b72ee65834b230223a401c0cd43914f1041c3106e6053da8b4d36275a79e9cba0c54f440b75534f792}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5004:5004"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5004/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  seed-users:
    build:
      context: ./services/core
    profiles: ["seed"]
    restart: "no"
    environment:
      NODE_ENV: development
      PORT: 5002
      MONGODB_URI: mongodb://mongo:27017/core_db
      SEED_OVERWRITE_PASSWORDS: ${SEED_OVERWRITE_PASSWORDS:-false}
    depends_on:
      mongo:
        condition: service_healthy
    command: ["npm", "run", "seed:users"]

  seed-demo:
    build:
      context: ./services/core
    profiles: ["demo"]
    restart: "no"
    environment:
      NODE_ENV: development
      PORT: 5002
      MONGODB_URI: mongodb://mongo:27017/core_db
    depends_on:
      mongo:
        condition: service_healthy
    command: ["npm", "run", "seed:demo"]

  frontend:
    build:
      context: ./frontend
      args:
        # Relative base works locally and in production (Nginx proxies `/api` to gateway).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "5111:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  mongo_data:
