name: CMS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Frontend CI (Lint & Build)
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Backend Microservices CI (Syntax Check & Unit Tests)
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend Microservices (Syntax & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Gateway Service
        run: |
          cd gateway
          npm ci
          node -c server.js

      - name: Test Core Service
        run: |
          cd services/core
          npm ci
          node -c src/index.js
          node src/tests/test_elibrary_security.js
          node src/tests/test_elibrary_logs.js

      - name: Test Attendance Service
        run: |
          cd services/attendance
          npm ci
          node -c src/index.js

      - name: Test AI Service
        run: |
          cd services/ai
          npm ci
          node -c src/index.js

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Docker Compose Validation
  # ─────────────────────────────────────────────────────────────
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml config

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Continuous Deployment (CD to VPS via SSH)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    needs: [frontend-ci, backend-ci, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "=================================================="
            echo "🚀 Starting Automated Deployment on VPS..."
            echo "=================================================="
            
            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR || '/var/www/cms' }}"
            cd "$PROJECT_DIR" || { echo "Directory $PROJECT_DIR not found"; exit 1; }
            
            echo "📥 Fetching and resetting to latest origin/main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Building and updating Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            echo "🧹 Cleaning up dangling Docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully! Container status:"
            docker compose -f docker-compose.prod.yml ps
