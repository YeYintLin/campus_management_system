services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Internal-only DB: no host port published. Other services reach it at `mongo:27017`.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: node:20-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/cms
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434}
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      # Keep node_modules inside the container so the bind-mount doesn't hide it.
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    command: ["sh", "-lc", "npm install && npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:20-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Frontend calls `/api/*`. Vite dev server proxies it to the backend.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:5001}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5111:5111"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0 --port 5111"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
