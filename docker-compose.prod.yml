services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Internal-only DB: no host port published. Other services reach it at `mongo:27017`.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/cms
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # In production, backend should be internal-only and reached via the frontend reverse proxy (/api).
    expose:
      - "5001"
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Relative base works locally and in production (Nginx proxies `/api` to backend).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      # Requested prod port is 8050. You can override with FRONTEND_PORT=<port> if needed.
      - "${FRONTEND_PORT:-8050}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
